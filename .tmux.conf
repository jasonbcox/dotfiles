
set -g default-terminal "tmux-256color"
set-option -g history-limit 10000

setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection
bind-key -T copy-mode-vi Home send-keys -X start-of-line
bind-key -T copy-mode-vi End send-keys -X end-of-line

bind-key C-w split-window -v \; swap-pane -U
bind-key C-s split-window -v
bind-key C-a split-window -h \; swap-pane -U
bind-key C-d split-window -h

# Enable selection of content only within the pane
set -g mouse on

# Clicks go to the app under the mouse but don't change the active pane
bind -T root MouseDown1Pane send-keys -M
bind -T root MouseDown3Pane send-keys -M

# Copy on release, keep highlight; single click dismisses
bind -T copy-mode-vi MouseDown1Pane    send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi DoubleClick1Pane  send-keys -X select-word \; send-keys -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi TripleClick1Pane  send-keys -X select-line \; send-keys -X copy-pipe-no-clear "pbcopy"
bind -T root DoubleClick1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H -t = ; send-keys -X -t = select-word ; send-keys -X -t = copy-pipe-no-clear "pbcopy" }
bind -T root TripleClick1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H -t = ; send-keys -X -t = select-line ; send-keys -X -t = copy-pipe-no-clear "pbcopy" }

# No tmux right-click menus
unbind -T root M-MouseDown3Pane
unbind -T root MouseDown3Status
unbind -T root M-MouseDown3Status
unbind -T root MouseDown3StatusLeft
unbind -T root M-MouseDown3StatusLeft
unbind -T root MouseDown3Empty
unbind -T root M-MouseDown3Empty

